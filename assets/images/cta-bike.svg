<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="100%" height="100%" fill="none">
  <!-- CTA Banner: Bicycle with happy dog in basket -->
  <g stroke="#17373E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rear Wheel -->
    <circle cx="65" cy="135" r="42" fill="rgba(255,255,255,0.2)"/>
    <circle cx="65" cy="135" r="4" fill="#17373E"/>
    <!-- Spokes -->
    <line x1="65" y1="93" x2="65" y2="177" stroke-width="1.5" stroke="#17373E" opacity="0.6"/>
    <line x1="23" y1="135" x2="107" y2="135" stroke-width="1.5" stroke="#17373E" opacity="0.6"/>
    <line x1="35" y1="105" x2="95" y2="165" stroke-width="1.5" stroke="#17373E" opacity="0.6"/>
    <line x1="35" y1="165" x2="95" y2="105" stroke-width="1.5" stroke="#17373E" opacity="0.6"/>

    <!-- Front Wheel -->
    <circle cx="195" cy="135" r="42" fill="rgba(255,255,255,0.2)"/>
    <circle cx="195" cy="135" r="4" fill="#17373E"/>
    <!-- Spokes -->
    <line x1="195" y1="93" x2="195" y2="177" stroke-width="1.5" stroke="#17373E" opacity="0.6"/>
    <line x1="153" y1="135" x2="237" y2="135" stroke-width="1.5" stroke="#17373E" opacity="0.6"/>
    <line x1="165" y1="105" x2="225" y2="165" stroke-width="1.5" stroke="#17373E" opacity="0.6"/>
    <line x1="165" y1="165" x2="225" y2="105" stroke-width="1.5" stroke="#17373E" opacity="0.6"/>

    <!-- Bicycle Frame (Classic Diamond) -->
    <!-- Bottom bracket -->
    <circle cx="120" cy="135" r="7" fill="#FFFFFF"/>
    <!-- Chain stays & seat stays -->
    <line x1="65" y1="135" x2="120" y2="135"/>
    <line x1="65" y1="135" x2="100" y2="78"/>
    <!-- Seat tube -->
    <line x1="100" y1="78" x2="120" y2="135"/>
    <line x1="100" y1="78" x2="96" y2="65"/>
    <!-- Saddle -->
    <path d="M 85 64 C 95 62, 112 62, 116 66 C 114 70, 92 70, 85 64 Z" fill="#17373E"/>
    
    <!-- Top tube -->
    <line x1="100" y1="78" x2="170" y2="78"/>
    <!-- Down tube -->
    <line x1="120" y1="135" x2="170" y2="78"/>
    <!-- Head tube & front fork -->
    <line x1="170" y1="78" x2="195" y2="135"/>
    <line x1="170" y1="78" x2="166" y2="52"/>
    <!-- Handlebars (Swept-back Cruiser style) -->
    <path d="M 166 52 C 160 48, 148 50, 146 56"/>
    <path d="M 166 52 C 172 48, 184 50, 186 56"/>

    <!-- Front Wire Basket -->
    <rect x="175" y="48" width="34" height="26" rx="4" fill="#FFFFFF" stroke="#17373E" stroke-width="2"/>
    <line x1="175" y1="56" x2="209" y2="56" stroke-width="1.2"/>
    <line x1="175" y1="64" x2="209" y2="64" stroke-width="1.2"/>
    <line x1="186" y1="48" x2="186" y2="74" stroke-width="1.2"/>
    <line x1="198" y1="48" x2="198" y2="74" stroke-width="1.2"/>
    <line x1="192" y1="74" x2="195" y2="135" stroke-width="1.5"/>

    <!-- Dog in Basket with ears blowing in wind -->
    <g transform="translate(180, 22)">
      <!-- Head -->
      <circle cx="12" cy="16" r="10" fill="#FFFFFF"/>
      <!-- Floppy ears trailing behind -->
      <path d="M 6 12 C 0 8, -6 12, -4 18 C -2 22, 5 18, 7 15" fill="#E2EEE7"/>
      <!-- Eyes & nose -->
      <circle cx="15" cy="15" r="1.3" fill="#17373E"/>
      <circle cx="19" cy="18" r="1.5" fill="#17373E"/>
      <!-- Happy panting tongue -->
      <path d="M 16 22 Q 18 26, 21 23" stroke="#8DC63F" stroke-width="2"/>
      <!-- Paws resting over edge of basket -->
      <ellipse cx="8" cy="27" rx="3" ry="2" fill="#FFFFFF"/>
      <ellipse cx="16" cy="27" rx="3" ry="2" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
