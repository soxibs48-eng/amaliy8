<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="100%" height="100%" fill="none">
  <!-- Whimsical Hero Illustration: Vet on skateboard with animal friends -->
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Breeze & motion lines -->
    <path d="M 30 180 C 60 175, 90 185, 110 180" stroke-dasharray="4 6" opacity="0.6"/>
    <path d="M 50 220 C 80 215, 120 225, 150 218" stroke-dasharray="5 7" opacity="0.6"/>
    <path d="M 40 260 C 70 255, 100 262, 130 258" stroke-dasharray="4 6" opacity="0.6"/>
    
    <!-- Bird in flight -->
    <g transform="translate(180, 70)">
      <path d="M 0 15 Q 15 0, 30 12 Q 45 0, 60 15 Q 40 12, 30 24 Q 20 12, 0 15 Z" fill="rgba(255,255,255,0.08)"/>
      <circle cx="20" cy="9" r="1.5" fill="#FFFFFF"/>
      <path d="M 12 18 Q 8 28, 5 35"/>
      <path d="M 16 20 Q 14 30, 12 36"/>
    </g>

    <!-- Skateboard -->
    <g id="skateboard">
      <!-- Deck -->
      <path d="M 160 415 C 190 405, 360 405, 410 412 C 425 414, 435 410, 442 398 C 445 405, 440 418, 420 422 C 370 428, 190 428, 145 422 C 130 420, 125 408, 128 398 C 135 410, 145 414, 160 415 Z" fill="#8DC63F" fill-opacity="0.25" stroke="#FFFFFF"/>
      <!-- Wheels & Trucks -->
      <line x1="175" y1="422" x2="175" y2="435"/>
      <circle cx="175" cy="442" r="12" fill="#1B3B42" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="175" cy="442" r="4" fill="#8DC63F"/>

      <line x1="380" y1="422" x2="380" y2="435"/>
      <circle cx="380" cy="442" r="12" fill="#1B3B42" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="380" cy="442" r="4" fill="#8DC63F"/>
      
      <!-- Ground speed lines -->
      <path d="M 100 455 L 230 455" stroke-dasharray="12 8" opacity="0.5"/>
      <path d="M 260 455 L 470 455" stroke-dasharray="16 10" opacity="0.5"/>
    </g>

    <!-- Happy Dog on skateboard -->
    <g id="dog" transform="translate(140, 260)">
      <!-- Dog body & legs -->
      <path d="M 20 145 L 20 100 C 20 70, 50 65, 75 70 C 95 75, 105 95, 105 145"/>
      <path d="M 40 145 L 40 110 C 45 105, 65 105, 75 110 L 75 145"/>
      <!-- Dog chest & collar -->
      <path d="M 75 70 C 85 60, 95 45, 90 35 C 85 25, 70 25, 60 30 C 50 35, 45 45, 50 55"/>
      <!-- Collar with tag -->
      <path d="M 62 48 Q 72 52, 82 48" stroke="#8DC63F" stroke-width="3"/>
      <circle cx="72" cy="56" r="3.5" fill="#8DC63F"/>
      <!-- Dog snout & head -->
      <path d="M 90 35 C 105 32, 115 28, 120 32 C 122 35, 118 42, 105 45 L 85 50"/>
      <circle cx="118" cy="31" r="2" fill="#FFFFFF"/>
      <!-- Eye -->
      <circle cx="85" cy="30" r="2" fill="#FFFFFF"/>
      <!-- Floppy Ear -->
      <path d="M 68 28 C 65 15, 52 18, 50 28 C 48 38, 58 45, 65 38 Z" fill="rgba(255,255,255,0.15)"/>
      <!-- Wagging tail -->
      <path d="M 20 95 C 0 85, -15 65, -10 50 C -5 40, 5 50, 10 70" stroke-width="3"/>
    </g>

    <!-- Vet Person (Woman on skateboard) -->
    <g id="vet">
      <!-- Back leg -->
      <path d="M 270 330 L 255 385 L 235 410 L 260 412"/>
      <!-- Front leg planted on board -->
      <path d="M 315 325 L 340 375 L 345 408 L 375 410"/>
      
      <!-- Trousers / scrubs -->
      <path d="M 265 250 C 265 290, 255 330, 255 345 C 265 348, 280 345, 290 320 C 300 345, 315 350, 325 345 C 325 320, 320 280, 320 250 Z" fill="rgba(255,255,255,0.06)"/>

      <!-- Torso / Vet Coat / Smock -->
      <path d="M 260 160 C 255 190, 250 230, 255 255 C 275 260, 310 260, 325 255 C 330 225, 335 185, 330 160 Z" fill="rgba(255,255,255,0.1)"/>
      <path d="M 290 160 L 290 255" stroke-dasharray="6 4"/>
      <!-- Stethoscope around neck -->
      <path d="M 280 165 C 278 190, 285 205, 295 210 C 305 205, 310 190, 308 165" stroke="#8DC63F" stroke-width="2.5"/>
      <circle cx="295" cy="216" r="4" fill="#8DC63F"/>
      
      <!-- Left arm gesturing forward -->
      <path d="M 325 170 C 355 185, 385 195, 410 185 L 420 182"/>
      <!-- Hand with relaxed fingers -->
      <path d="M 420 182 C 428 180, 432 185, 428 190 C 422 195, 415 195, 408 195"/>

      <!-- Right arm balancing back -->
      <path d="M 260 175 C 235 195, 210 215, 195 235 L 188 232"/>

      <!-- Neck & Head -->
      <path d="M 285 160 L 285 140 L 305 140 L 305 160"/>
      <!-- Head / Face looking forward -->
      <path d="M 285 135 C 285 110, 310 105, 320 120 C 328 130, 325 142, 310 145 C 298 147, 285 145, 285 135 Z"/>
      <!-- Profile nose & smile -->
      <path d="M 320 122 C 326 123, 327 127, 322 130 C 325 133, 321 137, 315 137"/>
      <!-- Eye -->
      <circle cx="310" cy="122" r="2" fill="#FFFFFF"/>
      
      <!-- Wind-blown Hair -->
      <path d="M 295 108 C 275 90, 250 95, 230 105 C 220 110, 235 125, 250 122 C 230 130, 225 145, 245 145 C 265 145, 280 135, 290 125" fill="#8DC63F" fill-opacity="0.3" stroke="#FFFFFF"/>
      <path d="M 305 108 C 315 95, 335 100, 340 108"/>
    </g>

    <!-- Playful Kitten sitting on vet's shoulder -->
    <g id="kitten" transform="translate(250, 115)">
      <path d="M 0 35 C -5 20, 5 10, 15 12 C 22 15, 25 25, 25 35 Z" fill="rgba(255,255,255,0.15)"/>
      <!-- Ears -->
      <path d="M 2 15 L 0 5 L 8 10"/>
      <path d="M 12 10 L 18 5 L 20 14"/>
      <!-- Eyes & nose -->
      <circle cx="6" cy="18" r="1.5" fill="#FFFFFF"/>
      <circle cx="14" cy="18" r="1.5" fill="#FFFFFF"/>
      <path d="M 9 22 L 11 22"/>
      <!-- Whiskers -->
      <line x1="2" y1="21" x2="-8" y2="19"/>
      <line x1="2" y1="24" x2="-7" y2="25"/>
      <line x1="18" y1="21" x2="28" y2="19"/>
      <line x1="18" y1="24" x2="27" y2="25"/>
      <!-- Tail curling down -->
      <path d="M -2 32 C -10 35, -12 45, -5 50 C 0 52, 2 48, -2 44" stroke-width="2.5"/>
    </g>
  </g>
</svg>
