<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%" fill="none">
  <!-- Footer Companion Illustration: Smiling vet with pet companion -->
  <g stroke="#17373E" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Big Dog Profile on Left -->
    <path d="M 40 145 C 38 100, 50 65, 80 60 C 95 62, 105 75, 102 95 C 100 115, 95 145, 95 145" fill="#F4F8F5"/>
    <!-- Dog floppy ear -->
    <path d="M 65 62 C 55 45, 40 50, 42 68 C 44 80, 58 85, 65 75 Z" fill="#8DC63F" fill-opacity="0.35"/>
    <!-- Eye & snout -->
    <path d="M 80 60 C 90 52, 105 52, 110 58 C 112 62, 108 68, 98 70" fill="#FFFFFF"/>
    <circle cx="86" cy="63" r="1.8" fill="#17373E"/>
    <circle cx="108" cy="58" r="2.2" fill="#8DC63F"/>

    <!-- Vet Face next to dog -->
    <g transform="translate(85, 65)">
      <!-- Head -->
      <circle cx="35" cy="30" r="18" fill="#FFFFFF"/>
      <!-- Hair -->
      <path d="M 22 24 C 20 12, 34 8, 46 12 C 54 16, 54 26, 48 32 C 40 25, 30 22, 22 24" fill="#8DC63F" fill-opacity="0.4"/>
      <!-- Smiling eye & smile -->
      <path d="M 38 28 Q 42 25, 46 28" stroke-width="2"/>
      <path d="M 40 36 Q 46 42, 50 37" stroke-width="2"/>
      <!-- Collar / Scrubs -->
      <path d="M 24 48 C 24 65, 30 75, 48 75 C 62 75, 68 65, 68 48" fill="#E8F4F1"/>
      <!-- Stethoscope curve -->
      <path d="M 32 50 C 32 58, 42 62, 48 60" stroke="#8DC63F" stroke-width="2"/>
      <circle cx="50" cy="62" r="2.5" fill="#8DC63F"/>
    </g>

    <!-- Kitten peeking over vet shoulder -->
    <g transform="translate(142, 85)">
      <path d="M 8 30 C 5 20, 12 12, 22 14 C 28 16, 30 24, 30 30" fill="#FFFFFF"/>
      <!-- Ears -->
      <path d="M 10 14 L 8 6 L 14 11" fill="#8DC63F" fill-opacity="0.3"/>
      <path d="M 20 12 L 25 6 L 25 15" fill="#8DC63F" fill-opacity="0.3"/>
      <circle cx="15" cy="18" r="1.3" fill="#17373E"/>
      <circle cx="23" cy="19" r="1.3" fill="#17373E"/>
      <line x1="12" y1="21" x2="6" y2="21"/>
      <line x1="25" y1="22" x2="31" y2="22"/>
    </g>
  </g>
</svg>
